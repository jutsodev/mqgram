[project]
name = "mqgram-proxy-backend"
version = "1.0.0"
description = "MQGram Proxy Management Backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.0.0",
]

[tool.setuptools]
py-modules = ["main"]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
