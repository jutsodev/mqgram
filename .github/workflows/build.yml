name: Build MQGram

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      with:
        submodules: recursive
        fetch-depth: 0

    - name: Setup Xcode
      run: |
        sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
        xcodebuild -version

    - name: Check system info
      run: |
        echo "CPU cores: $(sysctl -n hw.ncpu)"
        echo "Available RAM: $(vm_stat | grep 'free memory' | awk '{print $3}' | xargs)"
        echo "Disk space: $(df -h / | tail -1)"

    - name: Setup build cache
      uses: actions/cache@v3
      with:
        path: |
          ~/Library/Developer/Xcode/DerivedData
          ~/.bazel_cache
          /var/tmp/bazel-cache
        key: ${{ runner.os }}-xcode-${{ hashFiles('**/BUILD') }}
        restore-keys: |
          ${{ runner.os }}-xcode-

    - name: Clean previous builds
      run: |
        rm -rf ~/Library/Developer/Xcode/DerivedData || true
        bazel clean --expunge || true

    - name: Build with Xcode
      run: |
        cd $GITHUB_WORKSPACE
        xcodebuild \
          -workspace Telegram/Telegram.xcworkspace \
          -scheme Telegram \
          -configuration Release \
          -arch arm64 \
          -parallelizeTargets \
          -jobs $(sysctl -n hw.ncpu) \
          -derivedDataPath build \
          2>&1 | tee build.log

    - name: Check build result
      if: always()
      run: |
        if grep -q "Build complete!" build.log; then
          echo "✅ BUILD SUCCESSFUL!"
          exit 0
        elif grep -q "error:" build.log; then
          echo "❌ BUILD FAILED WITH ERRORS"
          grep "error:" build.log | head -20
          exit 1
        else
          tail -100 build.log
          exit 1
        fi

    - name: Upload build artifacts
      if: success()
      uses: actions/upload-artifact@v3
      with:
        name: MQGram-Build
        path: build/

    - name: Upload build log
      if: always()
      uses: actions/upload-artifact@v3
      with:
        name: build-log
        path: build.log

    - name: Report status
      if: always()
      run: |
        echo "### Build Report 📊" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        if [ -f build.log ]; then
          if grep -q "Build complete!" build.log; then
            echo "✅ **Status**: BUILD SUCCESSFUL" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Status**: BUILD FAILED" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Last 20 lines of log:**" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          tail -20 build.log >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
        fi
