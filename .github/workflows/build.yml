name: Build MQGram

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 0

    - name: Set up Bazel
      uses: bazelbuild/setup-bazelisk@v3

    - name: System Info
      run: |
        echo "🍎 macOS $(sw_vers -productVersion)"
        echo "💾 Xcode $(xcode-select -p)"
        xcodebuild -version
        echo "🔧 CPU cores: $(sysctl -n hw.ncpu)"
        bazel --version

    - name: Prepare Build Configuration
      run: |
        # Подготовка конфигурации для Bazel
        mkdir -p build-input/configuration-repository
        cp -R build-system/example-configuration/* build-input/configuration-repository/
        
        # Создаем MODULE.bazel для репозитория конфигурации
        echo 'module(name = "build_configuration")' > build-input/configuration-repository/MODULE.bazel
        
        # Создаем пустой WORKSPACE если его нет
        touch WORKSPACE

    - name: Build MQGram IPA (Bazel)
      run: |
        # Собираем Swiftgram с отключенной проверкой подписи для CI
        # Используем --config=release если доступно, иначе передаем флаги оптимизации
        bazel build \
          --jobs=$(sysctl -n hw.ncpu) \
          --announce_rc \
          --verbose_failures \
          --define=buildNumber=1 \
          --apple_generate_dsym=false \
          --//Telegram:disableProvisioningProfiles \
          //Telegram:Swiftgram \
          2>&1 | tee build_output.log

    - name: Locate and Rename IPA
      if: success()
      run: |
        # Ищем сгенерированный .ipa файл
        IPA_PATH=$(find bazel-bin -name "Swiftgram.ipa" | head -n 1)
        if [ -n "$IPA_PATH" ]; then
          cp "$IPA_PATH" MQGram.ipa
          echo "✅ IPA found at $IPA_PATH"
        else
          echo "❌ IPA not found in bazel-bin"
          # Пробуем найти .app и упаковать если .ipa не создался
          APP_PATH=$(find bazel-bin -name "Swiftgram.app" -type d | head -n 1)
          if [ -n "$APP_PATH" ]; then
            echo "📦 Packaging .app into .ipa manually..."
            mkdir -p Payload
            cp -R "$APP_PATH" Payload/
            zip -r MQGram.ipa Payload
            echo "✅ Manually created MQGram.ipa"
          else
            echo "❌ Swiftgram.app not found either"
            exit 1
          fi
        fi

    - name: Check Results
      if: always()
      run: |
        echo "### 📊 MQGram Build Report" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        
        if [ -f MQGram.ipa ]; then
          echo "✅ BUILD SUCCESSFUL: IPA created" >> $GITHUB_STEP_SUMMARY
        else
          echo "❌ BUILD FAILED" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "#### Errors found:" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          grep -i "error:" build_output.log | head -n 20 >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
        fi
        
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "#### Last 50 lines of output:" >> $GITHUB_STEP_SUMMARY
        echo '```' >> $GITHUB_STEP_SUMMARY
        tail -n 50 build_output.log >> $GITHUB_STEP_SUMMARY
        echo '```' >> $GITHUB_STEP_SUMMARY

    - name: Upload IPA
      if: success() && hashFiles('MQGram.ipa') != ''
      uses: actions/upload-artifact@v4
      with:
        name: MQGram-IPA
        path: MQGram.ipa

    - name: Upload Build Log
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: build-log
        path: build_output.log
