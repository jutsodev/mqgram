name: Build MQGram

on:
  push:
    branches: [master]
    tags: ['v*', 'build-*']
  pull_request:
    branches: [master]
  workflow_dispatch:
    inputs:
      build_number:
        description: 'Build number override (leave empty for auto from commit count)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      # Bazel with embedded JDK 24 crashes on macOS 15+ — use system JDK 21.
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set Xcode version
        run: |
          XCODE_VERSION=$(python3 -c 'import json; d=json.load(open("versions.json")); print(d["xcode"])')
          XCODE_PATH="/Applications/Xcode_${XCODE_VERSION}.app/Contents/Developer"
          if [ -d "$XCODE_PATH" ]; then
            sudo xcode-select -s "$XCODE_PATH"
            echo "Activated Xcode ${XCODE_VERSION}"
          else
            echo "Xcode ${XCODE_VERSION} not found at $XCODE_PATH, using default: $(xcode-select -p)"
          fi
          xcodebuild -version

      - name: Validate required secrets
        run: |
          if [ -z "${{ secrets.API_ID }}" ] || [ -z "${{ secrets.API_HASH }}" ]; then
            echo "::error::Required secrets API_ID and API_HASH are not set."
            echo "  Go to Settings → Secrets → Actions and add:"
            echo "  - API_ID   (from https://my.telegram.org)"
            echo "  - API_HASH (from https://my.telegram.org)"
            exit 1
          fi

      - name: Create build configuration
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          BUNDLE_ID: ${{ secrets.BUNDLE_ID }}
          TEAM_ID: ${{ secrets.TEAM_ID }}
        run: |
          python3 - <<'EOF'
          import json, os
          cfg = {
              "bundle_id": os.environ.get("BUNDLE_ID") or "ph.telegra.Telegraph",
              "api_id": os.environ["API_ID"],
              "api_hash": os.environ["API_HASH"],
              "team_id": os.environ.get("TEAM_ID") or "C67CF9S4VU",
              "app_center_id": "0",
              "is_internal_build": "false",
              "is_appstore_build": "false",
              "appstore_id": "0",
              "app_specific_url_scheme": "tg",
              "premium_iap_product_id": "",
              "enable_siri": False,
              "enable_icloud": False,
              "sg_config": ""
          }
          path = "build-system/ci-configuration.json"
          with open(path, "w") as f:
              json.dump(cfg, f, indent="\t")
          print(f"Created {path} (bundle_id={cfg['bundle_id']})")
          EOF

      - name: Copy sources to canonical path
        # Source paths are embedded in the binary; a stable path makes builds reproducible.
        # Use APFS clonefile (cp -cR) for near-instant copy instead of full cp -R.
        run: |
          sudo mkdir -p /Users/Shared
          cp -cR "$GITHUB_WORKSPACE" /Users/Shared/telegram-ios 2>/dev/null \
            || cp -R "$GITHUB_WORKSPACE" /Users/Shared/telegram-ios

      - name: Cache Bazel output
        uses: actions/cache@v4
        with:
          path: |
            ~/telegram-bazel-cache
            ~/.cache/mqgram-bazel-user-root
          key: bazel-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            bazel-${{ runner.os }}-${{ hashFiles('WORKSPACE', 'MODULE.bazel', 'MODULE.bazel.lock', 'versions.json') }}
            bazel-${{ runner.os }}-
          save-always: true

      - name: Compute build number and app version
        id: meta
        run: |
          SOURCE_DIR=/Users/Shared/telegram-ios
          if [ -n "${{ github.event.inputs.build_number }}" ]; then
            BUILD_NUMBER="${{ github.event.inputs.build_number }}"
          else
            OFFSET=$(cat "$SOURCE_DIR/build_number_offset" 2>/dev/null || echo 0)
            COMMIT_COUNT=$(git -C "$SOURCE_DIR" rev-list --count HEAD)
            BUILD_NUMBER=$((COMMIT_COUNT + OFFSET))
          fi
          APP_VERSION=$(python3 -c 'import json; d=json.load(open("/Users/Shared/telegram-ios/versions.json")); print(d["app"])')
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"
          echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"
          echo "build_number=$BUILD_NUMBER" >> "$GITHUB_OUTPUT"
          echo "MQGram $APP_VERSION build $BUILD_NUMBER"

      - name: Import fake certificates
        run: |
          cd /Users/Shared/telegram-ios
          python3 build-system/Make/ImportCertificates.py --path build-system/fake-codesigning/certs

      - name: Build MQGram (release_arm64)
        run: |
          set -euo pipefail
          SOURCE_DIR=/Users/Shared/telegram-ios
          BAZEL_USER_ROOT="$HOME/.cache/mqgram-bazel-user-root"
          CACHE_DIR="$HOME/telegram-bazel-cache"
          mkdir -p "$BAZEL_USER_ROOT" "$CACHE_DIR"
          cd "$SOURCE_DIR"
          python3 -u build-system/Make/Make.py \
            --cacheDir="$CACHE_DIR" \
            --bazelUserRoot="$BAZEL_USER_ROOT" \
            --overrideXcodeVersion \
            build \
            --configurationPath="build-system/ci-configuration.json" \
            --codesigningInformationPath=build-system/fake-codesigning \
            --configuration=release_arm64 \
            --buildNumber="$BUILD_NUMBER"

      - name: Collect artifacts
        run: |
          SOURCE_DIR=/Users/Shared/telegram-ios
          cd "$SOURCE_DIR"
          OUTPUT_PATH="build/artifacts"
          rm -rf "$OUTPUT_PATH"
          mkdir -p "$OUTPUT_PATH"
          IPA_FOUND=0
          if [ -f bazel-bin/Telegram/Swiftgram.ipa ]; then
            cp -L bazel-bin/Telegram/Swiftgram.ipa "$OUTPUT_PATH/MQGram.ipa"
            IPA_FOUND=1
          else
            CANDIDATE=$(find bazel-out -path '*/bin/Telegram/Swiftgram.ipa' -type f 2>/dev/null | head -n 1)
            if [ -z "$CANDIDATE" ]; then
              CANDIDATE=$(find bazel-out -path '*/bin/Telegram/*.ipa' -type f 2>/dev/null | head -n 1)
            fi
            if [ -n "$CANDIDATE" ]; then
              cp "$CANDIDATE" "$OUTPUT_PATH/MQGram.ipa"
              IPA_FOUND=1
            fi
          fi
          if [ "$IPA_FOUND" = "0" ]; then
            echo "::error::No IPA found under bazel-bin or bazel-out"
            ls -la bazel-bin/Telegram 2>&1 || true
            find bazel-out -name '*.ipa' 2>/dev/null | head -n 20 || true
            exit 1
          fi
          mkdir -p build/DSYMs
          for f in bazel-bin/Telegram/*.dSYM bazel-bin/Telegram/*.framework.dSYM bazel-bin/Telegram/*.appex.dSYM; do
            [ -e "$f" ] && cp -RL "$f" build/DSYMs/ 2>/dev/null || true
          done
          while IFS= read -r f; do
            [ -d "$f" ] && cp -R "$f" build/DSYMs/ 2>/dev/null || true
          done < <(find bazel-out -path '*/bin/Telegram/*.dSYM' -prune 2>/dev/null)
          zip -r "$OUTPUT_PATH/MQGram.DSYMs.zip" build/DSYMs 1>/dev/null || true
          echo "Artifacts:"
          ls -lh "$OUTPUT_PATH/"

      - name: Build sideload-friendly lite IPA
        run: |
          set -euo pipefail
          SOURCE_DIR=/Users/Shared/telegram-ios
          ARTIFACTS_DIR="$SOURCE_DIR/build/artifacts"
          STAGE="$SOURCE_DIR/build/lite-stage"
          rm -rf "$STAGE" && mkdir -p "$STAGE"
          cd "$STAGE"
          unzip -q "$ARTIFACTS_DIR/MQGram.ipa"
          APP_DIR=$(find Payload -maxdepth 1 -name '*.app' -type d | head -n 1)
          rm -rf "$APP_DIR/PlugIns"
          rm -rf "$APP_DIR/Watch"
          rm -f  "$APP_DIR/embedded.mobileprovision"
          rm -rf "$APP_DIR/_CodeSignature"
          find "$APP_DIR/Frameworks" -name "_CodeSignature" -type d -prune -exec rm -rf {} +
          python3 - "$APP_DIR" <<'PY'
          import plistlib, sys
          path = sys.argv[1] + '/Info.plist'
          with open(path, 'rb') as f: p = plistlib.load(f)
          modes = p.get('UIBackgroundModes', [])
          keep = [m for m in modes if m in ('fetch', 'processing')]
          if keep: p['UIBackgroundModes'] = keep
          else:    p.pop('UIBackgroundModes', None)
          p.pop('NSUserActivityTypes', None)
          with open(path, 'wb') as f: plistlib.dump(p, f, fmt=plistlib.FMT_BINARY)
          PY
          zip -r -q -X "$ARTIFACTS_DIR/MQGram-lite.ipa" Payload SwiftSupport
          echo "Lite artifact:"
          ls -lh "$ARTIFACTS_DIR/MQGram-lite.ipa"

      - name: Upload IPAs as workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MQGram-${{ env.BUILD_NUMBER }}
          path: |
            /Users/Shared/telegram-ios/build/artifacts/MQGram.ipa
            /Users/Shared/telegram-ios/build/artifacts/MQGram-lite.ipa
          retention-days: 30

      - name: Create GitHub Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ env.BUILD_NUMBER }}
          name: MQGram ${{ env.APP_VERSION }} (${{ env.BUILD_NUMBER }})
          body: |
            Unsigned MQGram ${{ env.APP_VERSION }} build ${{ env.BUILD_NUMBER }}

            **Two IPAs are attached:**
            - `MQGram.ipa` — full build with all extensions (push, share,
              widgets, Siri, broadcast upload, watch companion). Best for
              **TrollStore** (iOS 14.0–16.6.1) or a paid Apple Developer
              certificate that can grant Telegram's entitlements.
            - `MQGram-lite.ipa` — stripped build with no extensions, no watch
              app, no `UIBackgroundModes` for VoIP / push / audio. Use this
              with **Sideloadly / AltStore / ESign** and a free Apple ID on
              iOS 17+/18+ where TrollStore is unavailable. Push, Siri, widgets
              and the share extension will be disabled in this variant.

            > ⚠️ **Unsigned IPA** — built with fake codesigning certificates.
            > You must resign it with your own developer certificate before installing.
          draft: false
          prerelease: false
          files: |
            /Users/Shared/telegram-ios/build/artifacts/MQGram.ipa
            /Users/Shared/telegram-ios/build/artifacts/MQGram-lite.ipa
            /Users/Shared/telegram-ios/build/artifacts/MQGram.DSYMs.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
