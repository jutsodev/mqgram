name: Build MQGram

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          fetch-depth: '0'

      - name: Select Xcode (latest available)
        run: |
          # versions.json may pin a future Xcode that's not on the runner.
          # Use whatever GitHub provides.
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version

      - name: Create canonical source directory
        run: |
          set -x
          sudo mkdir -p /Users/Shared
          cp -R $GITHUB_WORKSPACE /Users/Shared/
          mv /Users/Shared/$(basename $GITHUB_WORKSPACE) /Users/Shared/telegram-ios

      - name: Build the App (Swiftgram target)
        run: |
          set -x
          SOURCE_DIR=/Users/Shared/telegram-ios
          BAZEL_USER_ROOT="/private/var/tmp/_bazel_containerhost"

          cd $SOURCE_DIR

          BUILD_NUMBER_OFFSET="$(cat build_number_offset)"
          export APP_VERSION=$(python3 -c 'import json;print(json.load(open("versions.json"))["app"])')
          export COMMIT_COUNT=$(git rev-list --count HEAD)
          export COMMIT_COUNT="$(($COMMIT_COUNT+$BUILD_NUMBER_OFFSET))"
          export BUILD_NUMBER="$COMMIT_COUNT"
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> $GITHUB_ENV
          echo "APP_VERSION=$APP_VERSION" >> $GITHUB_ENV

          python3 build-system/Make/ImportCertificates.py --path build-system/fake-codesigning/certs
          python3 -u build-system/Make/Make.py \
            --bazelUserRoot="$BAZEL_USER_ROOT" \
            build \
            --configurationPath="build-system/appstore-configuration.json" \
            --codesigningInformationPath=build-system/fake-codesigning \
            --configuration=release_arm64 \
            --buildNumber="$BUILD_NUMBER"

          # Swiftgram fork outputs Swiftgram.ipa
          OUTPUT_PATH="build/artifacts"
          rm -rf "$OUTPUT_PATH"
          mkdir -p "$OUTPUT_PATH"
          for f in bazel-out/applebin_ios-ios_arm*-opt-ST-*/bin/Telegram/Swiftgram.ipa bazel-out/applebin_ios-ios_arm*-opt-ST-*/bin/Telegram/Telegram.ipa; do
            [ -f "$f" ] && cp "$f" $OUTPUT_PATH/MQGram.ipa
          done

          mkdir -p build/DSYMs
          for f in bazel-out/applebin_ios-ios_arm*-opt-ST-*/bin/Telegram/*.dSYM; do
            [ -d "$f" ] && cp -R "$f" build/DSYMs/
          done
          if [ -d build/DSYMs ] && [ "$(ls -A build/DSYMs)" ]; then
            zip -r "./$OUTPUT_PATH/MQGram.DSYMs.zip" build/DSYMs 1>/dev/null
          fi

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: MQGram-ipa
          path: /Users/Shared/telegram-ios/build/artifacts/MQGram.ipa
          if-no-files-found: warn

      - name: Upload DSYM artifact
        uses: actions/upload-artifact@v4
        with:
          name: MQGram-dsym
          path: /Users/Shared/telegram-ios/build/artifacts/MQGram.DSYMs.zip
          if-no-files-found: warn

      - name: Create Release
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ env.BUILD_NUMBER }}
          name: MQGram ${{ env.APP_VERSION }} (${{ env.BUILD_NUMBER }})
          body: |
            Unsigned build of MQGram ${{ env.APP_VERSION }} (build ${{ env.BUILD_NUMBER }}).

            To install you need to re-sign the IPA (e.g. with Sideloadly / AltStore / TrollStore).
          files: |
            /Users/Shared/telegram-ios/build/artifacts/MQGram.ipa
            /Users/Shared/telegram-ios/build/artifacts/MQGram.DSYMs.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
