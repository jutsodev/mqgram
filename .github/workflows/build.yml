name: Build MQGram

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set Xcode version
        run: |
          XCODE_PATH="/Applications/Xcode_26.app/Contents/Developer"
          if [ -d "$XCODE_PATH" ]; then
            sudo xcode-select -s "$XCODE_PATH"
          else
            XCODE_PATH=$(ls -d /Applications/Xcode_*.app/Contents/Developer | sort -V | tail -n 1)
            if [ -n "$XCODE_PATH" ]; then
              sudo xcode-select -s "$XCODE_PATH"
            fi
          fi
          xcodebuild -version

      - name: Cache Bazel
        uses: actions/cache@v4
        with:
          path: |
            ~/telegram-bazel-cache
            ~/.cache/mqgram-bazel-user-root
          key: bazel-${{ runner.os }}-${{ hashFiles('WORKSPACE', 'MODULE.bazel', 'versions.json') }}
          restore-keys: |
            bazel-${{ runner.os }}-

      - name: Create build configuration
        run: |
          python3 - <<'EOF'
          import json, os
          cfg = {
            "bundle_id": "ph.telegra.Telegraph",
            "api_id": "2496",
            "api_hash": "8ee6933d125226c0c000350438686948",
            "team_id": "C67CF9S4VU",
            "app_center_id": "0",
            "is_internal_build": "false",
            "is_appstore_build": "false",
            "appstore_id": "0",
            "app_specific_url_scheme": "tg",
            "premium_iap_product_id": "",
            "enable_siri": False,
            "enable_icloud": False,
            "sg_config": ""
          }
          path = "build-system/ci-configuration.json"
          os.makedirs(os.path.dirname(path), exist_ok=True)
          with open(path, "w") as f:
              json.dump(cfg, f, indent="\t")
          EOF

      - name: Import fake certificates
        run: |
          python3 build-system/Make/ImportCertificates.py --path build-system/fake-codesigning/certs

      - name: Build MQGram (release_arm64)
        run: |
          python3 -u build-system/Make/Make.py \
            --cacheDir="$HOME/telegram-bazel-cache" \
            --bazelUserRoot="$HOME/.cache/mqgram-bazel-user-root" \
            --overrideXcodeVersion \
            build \
            --configurationPath="build-system/ci-configuration.json" \
            --codesigningInformationPath="build-system/fake-codesigning" \
            --configuration=release_arm64 \
            --buildNumber="1"

      - name: Collect artifacts
        if: always()
        run: |
          mkdir -p build/artifacts
          IPA_PATH=$(find bazel-bin -name "*.ipa" | head -n 1)
          if [ -n "$IPA_PATH" ]; then
            cp -L "$IPA_PATH" build/artifacts/MQGram.ipa
          else
            CANDIDATE=$(find bazel-out -name "*.ipa" | head -n 1)
            if [ -n "$CANDIDATE" ]; then
              cp "$CANDIDATE" build/artifacts/MQGram.ipa
            else
              APP_PATH=$(find bazel-bin -name "*.app" -type d | head -n 1)
              if [ -n "$APP_PATH" ]; then
                mkdir -p Payload
                cp -R "$APP_PATH" Payload/
                zip -r build/artifacts/MQGram.ipa Payload
              fi
            fi
          fi

      - name: Upload IPA
        if: success() && hashFiles('build/artifacts/MQGram.ipa') != ''
        uses: actions/upload-artifact@v4
        with:
          name: MQGram-IPA
          path: build/artifacts/MQGram.ipa

      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build_output.log
