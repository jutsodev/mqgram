name: Build MQGram

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 0

    - name: Set up Bazel
      uses: bazelbuild/setup-bazelisk@v3

    - name: System Info
      run: |
        echo "🍎 macOS $(sw_vers -productVersion)"
        echo "💾 Xcode $(xcode-select -p)"
        xcodebuild -version
        echo "🔧 CPU cores: $(sysctl -n hw.ncpu)"
        bazel --version

    - name: Prepare Build Configuration
      run: |
        # Используем пример конфигурации для сборки
        mkdir -p build-input/configuration-repository
        cp -R build-system/example-configuration/* build-input/configuration-repository/
        
        # Создаем пустой WORKSPACE если его нет (Bazel требует его наличия)
        touch WORKSPACE

    - name: Build MQGram (Bazel)
      run: |
        # Собираем основную цель Swiftgram
        bazel build \
          --jobs=$(sysctl -n hw.ncpu) \
          --local_ram_resources=12288 \
          --announce_rc \
          --verbose_failures \
          --define=buildNumber=1 \
          --apple_generate_dsym=false \
          //Telegram:Swiftgram \
          2>&1 | tee build_output.log
      
    - name: Check Results
      if: always()
      run: |
        echo "### 📊 MQGram Build Report" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        
        if grep -q "Build completed successfully" build_output.log; then
          echo "✅ BUILD SUCCESSFUL" >> $GITHUB_STEP_SUMMARY
        else
          echo "❌ BUILD FAILED" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "#### Errors found:" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          grep -i "error:" build_output.log | head -n 20 >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
        fi
        
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "#### Last 50 lines of output:" >> $GITHUB_STEP_SUMMARY
        echo '```' >> $GITHUB_STEP_SUMMARY
        tail -n 50 build_output.log >> $GITHUB_STEP_SUMMARY
        echo '```' >> $GITHUB_STEP_SUMMARY

    - name: Upload Build Log
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: build-log
        path: build_output.log
