name: Build MQGram

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-13
    
    steps:
    - name: Checkout
      uses: actions/checkout@v3
      with:
        submodules: recursive
        fetch-depth: 0

    - name: System Info
      run: |
        echo "🍎 macOS $(sw_vers -productVersion)"
        echo "💾 Xcode $(xcode-select -p)"
        xcodebuild -version
        echo "🔧 CPU cores: $(sysctl -n hw.ncpu)"

    - name: Clean
      run: |
        rm -rf ~/Library/Developer/Xcode/DerivedData 2>/dev/null || true
        rm -rf build 2>/dev/null || true

    - name: Build MQGram
      run: |
        cd "${{ github.workspace }}"
        
        # Проверяем что workspace существует
        ls -la Telegram/ | grep xcworkspace || echo "Workspace not found"
        
        # Пробуем собрать
        xcodebuild \
          -workspace Telegram/Telegram.xcworkspace \
          -scheme Telegram \
          -configuration Release \
          -arch arm64 \
          -derivedDataPath build \
          -quiet \
          2>&1 | tee build_output.log
      
      continue-on-error: true

    - name: Check Results
      if: always()
      run: |
        echo "📊 Build Results:"
        echo ""
        
        if [ -f build_output.log ]; then
          if grep -i "error:" build_output.log; then
            echo "❌ ERRORS FOUND"
            echo ""
            echo "First 5 errors:"
            grep -i "error:" build_output.log | head -5
          elif grep -q "Build complete" build_output.log || tail -50 build_output.log | grep -q "succeeded"; then
            echo "✅ BUILD SUCCESSFUL"
          else
            echo "⚠️ UNKNOWN STATUS - Last 30 lines:"
            tail -30 build_output.log
          fi
        else
          echo "No build log found"
        fi

    - name: Upload Build Log
      if: always()
      uses: actions/upload-artifact@v3
      with:
        name: build-log
        path: build_output.log
        if-no-files-found: ignore

    - name: Summary
      if: always()
      run: |
        echo "### 📊 MQGram Build Report" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
        echo "**Branch:** ${{ github.ref }}" >> $GITHUB_STEP_SUMMARY
        echo "**Runner:** macOS 13" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        
        if [ -f build_output.log ]; then
          LAST_LINES=$(tail -20 build_output.log)
          echo "**Build Output (last 20 lines):**" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "$LAST_LINES" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
        fi
