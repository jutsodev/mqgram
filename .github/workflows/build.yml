name: Build MQGram

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 0

    - name: Set up Bazel
      uses: bazelbuild/setup-bazelisk@v3

    - name: System Info
      run: |
        echo "🍎 macOS $(sw_vers -productVersion)"
        echo "💾 Xcode $(xcode-select -p)"
        xcodebuild -version
        echo "🔧 CPU cores: $(sysctl -n hw.ncpu)"
        bazel --version

    - name: Patch BUILD files
      run: |
        # Вместо внешнего rules_shell используем нативные правила, которые обычно доступны
        # Если sh_binary не определен, это странно для Bazel, но попробуем убрать патч
        # и просто собрать основную цель
        git checkout Telegram/BUILD
        
        # Проверяем как на самом деле называется основная цель
        TARGET=$(grep -E "ios_application\(|ios_application_bundle\(" -B 5 Telegram/BUILD | grep "name =" | head -n 1 | cut -d'"' -f2)
        echo "Detected target: $TARGET"
        echo "TARGET=$TARGET" >> $GITHUB_ENV

    - name: Prepare Build Configuration
      run: |
        mkdir -p build-input/configuration-repository
        cp -R build-system/example-configuration/* build-input/configuration-repository/
        echo 'module(name = "build_configuration")' > build-input/configuration-repository/MODULE.bazel
        touch WORKSPACE

    - name: Build MQGram (Bazel)
      run: |
        # Собираем основную цель (обычно Telegram или Swiftgram)
        bazel build \
          --jobs=$(sysctl -n hw.ncpu) \
          --announce_rc \
          --verbose_failures \
          --check_direct_dependencies=off \
          --define=buildNumber=1 \
          --apple_generate_dsym=false \
          //Telegram:${{ env.TARGET }} \
          2>&1 | tee build_output.log

    - name: Locate and Rename IPA
      if: always()
      run: |
        IPA_PATH=$(find bazel-bin -name "*.ipa" | head -n 1)
        if [ -n "$IPA_PATH" ]; then
          cp "$IPA_PATH" MQGram.ipa
          echo "✅ IPA found at $IPA_PATH"
        else
          echo "❌ IPA not found in bazel-bin"
          APP_PATH=$(find bazel-bin -name "*.app" -type d | head -n 1)
          if [ -n "$APP_PATH" ]; then
            echo "📦 Packaging .app into .ipa manually..."
            mkdir -p Payload
            cp -R "$APP_PATH" Payload/
            zip -r MQGram.ipa Payload
            echo "✅ Manually created MQGram.ipa"
          else
            echo "❌ No .app found either"
          fi
        fi

    - name: Check Results
      if: always()
      run: |
        echo "### 📊 MQGram Build Report" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        if [ -f MQGram.ipa ]; then
          echo "✅ BUILD SUCCESSFUL: IPA created" >> $GITHUB_STEP_SUMMARY
        else
          echo "❌ BUILD FAILED" >> $GITHUB_STEP_SUMMARY
          echo "#### Errors found:" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          grep -i "error:" build_output.log | head -n 20 >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
        fi
        echo "#### Last 50 lines of output:" >> $GITHUB_STEP_SUMMARY
        echo '```' >> $GITHUB_STEP_SUMMARY
        tail -n 50 build_output.log >> $GITHUB_STEP_SUMMARY
        echo '```' >> $GITHUB_STEP_SUMMARY

    - name: Upload IPA
      if: success() && hashFiles('MQGram.ipa') != ''
      uses: actions/upload-artifact@v4
      with:
        name: MQGram-IPA
        path: MQGram.ipa

    - name: Upload Build Log
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: build-log
        path: build_output.log
